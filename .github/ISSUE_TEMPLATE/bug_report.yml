name: "🐛 Bug report"
description: Something isn't working as it should (wrong values, crashes, disconnects, errors in the log)
title: "[Module] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out as much of this as you can — it makes the bug much faster to track down.

        In the title above, replace `[Module]` with the module you picked below (e.g. `[Sessions]`, `[Pozor]`).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      options:
        - label: I'm running the latest release and the bug still reproduces
          required: true
        - label: I searched existing issues and this isn't a duplicate
          required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which part of the app is affected?
      multiple: false
      options:
        - Sessions
        - Catalog
        - Prom
        - Pozor
        - Graphs
        - Compare
        - Tools
        - Settings
        - Info / login
        - GitHub repo / CI
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: whats-wrong
    attributes:
      label: What's wrong
      description: What happened? Include exact error messages or wrong values if you have them.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see this ourselves?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / video
      description: Drag and drop images or a screen recording here if you have them.
    validations:
      required: false
