name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  # Lets the draft be regenerated on demand — e.g. after relabeling an
  # already-merged PR, which doesn't itself produce a push or pull_request
  # event on main.
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # release-drafter reads .github/release-drafter.yml from the PR's
      # base branch, not its head branch, so on a `pull_request` event it
      # 404s (and this step fails) until that file has landed on main at
      # least once — including on the PR that first adds it. Non-blocking
      # so that bootstrap run doesn't sit red forever; once main has the
      # config, autolabeling on later PRs just works.
      - uses: release-drafter/release-drafter@v6
        id: drafter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-drafter only ever looks at merged pull requests — it has no
      # concept of a commit pushed straight to main. Lovable (the
      # gpt-engineer-app[bot] identity) can't open PRs, so every edit it
      # makes through the Lovable editor goes straight to main and was
      # previously invisible in the draft release notes. This folds those
      # commits in separately: run only on an actual push to main (not on
      # PR events, which don't touch the persisted draft), skip merge
      # commits (those came in through a PR and are already counted),
      # collapse Lovable's many near-content-free "Changes"/"WIP" messages
      # into a single tally instead of spamming one bullet each, and keep
      # the rest as real bullets so a genuinely descriptive Lovable commit
      # isn't silently dropped.
      - name: Fold in direct Lovable edits
        if: github.event_name == 'push' && steps.drafter.outputs.id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.drafter.outputs.id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);

            let baseTag;
            try {
              const { data: latest } = await github.rest.repos.getLatestRelease({ owner, repo });
              baseTag = latest.tag_name;
            } catch (e) {
              core.info(`No published release to diff against yet, skipping: ${e.message}`);
              return;
            }

            const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${baseTag}...main`,
            });

            const BOT_LOGIN = "gpt-engineer-app[bot]";
            // Lovable's own placeholder commit messages — near-zero signal on their own.
            const NOISE = new Set([
              "changes", "change", "update", "updates", "fix", "fixes", "wip",
              "work in progress", "minor changes", "small changes", "misc",
              "tweaks", "cleanup", "various fixes", "small fixes",
            ]);

            const seen = new Set();
            const bullets = [];
            let noiseCount = 0;

            for (const c of cmp.commits) {
              const isBot = c.author?.login === BOT_LOGIN || c.commit.author?.name === BOT_LOGIN;
              const isMergeCommit = (c.parents?.length ?? 1) > 1;
              if (!isBot || isMergeCommit) continue;

              const msg = c.commit.message.split("\n")[0].trim();
              const key = msg.toLowerCase();
              if (NOISE.has(key) || msg.length < 8) {
                noiseCount++;
                continue;
              }
              if (seen.has(key)) continue; // collapse repeated identical messages
              seen.add(key);
              bullets.push(`- ${msg} (${c.sha.slice(0, 7)})`);
            }

            if (bullets.length === 0 && noiseCount === 0) {
              core.info("No direct Lovable commits since the last release.");
              return;
            }
            if (noiseCount > 0) {
              bullets.push(`- …and ${noiseCount} smaller live edit${noiseCount === 1 ? "" : "s"} via Lovable with no descriptive message`);
            }

            const MARK_START = "<!-- lovable-direct-edits:start -->";
            const MARK_END = "<!-- lovable-direct-edits:end -->";
            const section = [
              MARK_START,
              "",
              "## 🪄 Direct Lovable Edits",
              "",
              "_Pushed straight to `main` through the Lovable editor — it can't open pull requests, so these never get a release-note label. Listed here instead of being silently dropped:_",
              "",
              ...bullets,
              "",
              MARK_END,
            ].join("\n");

            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            const re = new RegExp(`${MARK_START}[\\s\\S]*?${MARK_END}`);
            const body = release.body ?? "";
            const newBody = re.test(body) ? body.replace(re, section) : `${body.trimEnd()}\n\n${section}\n`;

            await github.rest.repos.updateRelease({ owner, repo, release_id: releaseId, body: newBody });
