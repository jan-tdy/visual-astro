name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '✨ Features'
    labels:
      - enhancement
  # Checked first so a PR labeled both `bug` and `data-integrity` (most of
  # them are) lands here rather than in the generic Fixes bucket below —
  # these are the ones where something was actually lost or corrupted, not
  # just behaving wrong, and readers of the changelog should be able to
  # tell the difference at a glance.
  - title: '🔒 Data Integrity & Security'
    labels:
      - data-integrity
  # Same reasoning, for a PR that's a refinement/polish rather than
  # "this was broken" — wording tweaks, UX adjustments, non-data-loss
  # behavior changes that don't fit "Features" either.
  - title: '🧭 Improvements'
    labels:
      - improvement
  - title: '🐛 Fixes'
    labels:
      - bug
  - title: '📦 Dependency Updates'
    labels:
      - dependencies

exclude-labels:
  - skip-changelog

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  minor:
    labels:
      - enhancement
  patch:
    labels:
      - bug
      - dependencies
      - data-integrity
      - improvement
  default: patch

autolabeler:
  # PR template "Type of Change" checkboxes
  - label: enhancement
    body:
      - '/-\s*\[x\]\s*New feature/i'
    branch:
      - '/^feature\/.+/i'
    title:
      - '/^feat(ure)?(\(.+\))?!?:/i'
  - label: bug
    body:
      - '/-\s*\[x\]\s*Bug fix/i'
    branch:
      - '/^(fix|bugfix)\/.+/i'
    title:
      - '/^fix(\(.+\))?!?:/i'
  # Dependabot already labels its own PRs "dependencies"; this also
  # catches manual version bump PRs ("Bump X to Y") by title/branch.
  - label: dependencies
    title:
      - '/^(chore\(deps\)|bump)/i'
    branch:
      - '/^bump\/.+/i'

template: |
  ## What's Changed

  $CHANGES
